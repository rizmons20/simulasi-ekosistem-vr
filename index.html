<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi MVR - Simulasi Ekosistem (STEM-DT VR)</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    :root {
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.16);
      --panel: rgba(15, 23, 42, 0.84);
      --cyan: #38bdf8;
      --green: #34d399;
      --amber: #facc15;
      --red: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020617;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .a-enter-vr {
      right: 18px !important;
      bottom: 124px !important;
    }

    .a-enter-vr-button {
      width: 46px !important;
      height: 46px !important;
      border-radius: 14px !important;
      background: rgba(15, 23, 42, 0.92) !important;
      border: 1px solid rgba(56, 189, 248, 0.45) !important;
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.38);
    }

    .desktop-ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      color: var(--ink);
    }

    .topbar,
    .stage-dock,
    .control-dock {
      pointer-events: auto;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 16px 48px rgba(2, 6, 23, 0.28);
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 8px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #082f49;
      background: linear-gradient(135deg, #7dd3fc, #22d3ee);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.22);
    }

    .brand-copy strong {
      display: block;
      font-size: 13.5px;
      letter-spacing: 0.01em;
    }

    .brand-copy span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border-radius: 12px;
      color: #cbd5e1;
      background: rgba(51, 65, 85, 0.55);
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7);
      transition: background 200ms ease, box-shadow 200ms ease;
    }

    .status-pill.connected .status-dot {
      background: var(--green);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.75);
    }

    .status-pill.disconnected .status-dot {
      background: var(--red);
      box-shadow: 0 0 14px rgba(248, 113, 113, 0.75);
    }

    .dock-button {
      border: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: 160ms ease;
    }

    .dock-button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .stage-dock {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      height: 68px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px;
    }

    .stage-button {
      min-width: 118px;
      height: 52px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 7px 11px;
      color: #94a3b8;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: 160ms ease;
    }

    .stage-button:hover {
      background: rgba(51, 65, 85, 0.45);
      color: #e2e8f0;
    }

    .stage-button.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.28), rgba(56, 189, 248, 0.12));
      border-color: rgba(56, 189, 248, 0.5);
      color: #f8fafc;
    }

    .stage-button.done {
      border-color: rgba(52, 211, 153, 0.28);
    }

    .stage-button strong {
      display: block;
      font-size: 12px;
    }

    .stage-button span {
      display: block;
      margin-top: 3px;
      font-size: 9.5px;
      white-space: nowrap;
    }

    .control-dock {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 164px;
      border-radius: 18px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .dock-button {
      height: 40px;
      border-radius: 11px;
      background: rgba(51, 65, 85, 0.72);
      font-size: 11.5px;
    }

    .dock-button.confirm {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #0284c7, #0891b2);
      border-color: rgba(125, 211, 252, 0.35);
      font-weight: 700;
    }

    .dock-button.revise {
      color: #fecaca;
    }

    .dock-button.export {
      color: #cbd5e1;
    }

    @media (max-width: 980px) {
      .brand-copy span { display: none; }
      .stage-dock {
        left: 18px;
        right: 18px;
        transform: none;
        overflow-x: auto;
      }
      .stage-button { min-width: 104px; }
      .control-dock { display: none; }
      .a-enter-vr { bottom: 96px !important; }
    }

    @media (max-width: 640px) {
      .topbar { height: 52px; top: 10px; left: 10px; right: 10px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-copy strong { font-size: 11.5px; }
      .status-pill { height: 34px; max-width: 150px; overflow: hidden; font-size: 10.5px; }
      .stage-dock { bottom: 10px; left: 10px; right: 10px; height: 62px; }
      .stage-button { min-width: 82px; height: 46px; }
      .stage-button span { display: none; }
    }
  </style>
</head>
<body>
  <div class="desktop-ui" id="desktopUi">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-copy">
          <strong>Simulasi Ekosistem Sungai</strong>
          <span>STEM-DT · Mixed & Virtual Reality</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="status-pill" id="desktopStatus">
          <span class="status-dot"></span>
          <span id="desktopStatusText">Memeriksa koneksi...</span>
        </div>
      </div>
    </header>

    <nav class="stage-dock" aria-label="Tahap pembelajaran">
      <button class="stage-button active" type="button" data-stage="EA" onclick="selectStage('EA')">
        <strong>1 · EA</strong><span>Empathize & Ask</span>
      </button>
      <button class="stage-button" type="button" data-stage="DI" onclick="selectStage('DI')">
        <strong>2 · DI</strong><span>Define & Imagine</span>
      </button>
      <button class="stage-button" type="button" data-stage="IP" onclick="selectStage('IP')">
        <strong>3 · IP</strong><span>Ideate & Plan</span>
      </button>
      <button class="stage-button" type="button" data-stage="PC" onclick="selectStage('PC')">
        <strong>4 · PC</strong><span>Prototype & Create</span>
      </button>
      <button class="stage-button" type="button" data-stage="TI" onclick="selectStage('TI')">
        <strong>5 · TI</strong><span>Test & Improve</span>
      </button>
    </nav>

    <aside class="control-dock" aria-label="Kontrol simulasi">
      <button class="dock-button revise" type="button" onclick="handleReviseAction()">Revisi</button>
      <button class="dock-button export" type="button" onclick="exportCSV()" title="Simpan catatan interaksi">Ekspor</button>
      <button class="dock-button confirm" type="button" onclick="handleConfirmAction()">Konfirmasi</button>
    </aside>
  </div>

  <a-scene background="color: #0f172a">
    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" position="-2 5 3" intensity="0.85"></a-light>
    <a-light type="point" position="-3.6 2.2 -2.0" color="#38bdf8" intensity="0.6" distance="6"></a-light>
    <a-sky color="#0f172a"></a-sky>

    <a-plane rotation="-90 0 0" width="24" height="24" color="#0b1120" position="0 0 0"></a-plane>
    <a-entity position="0 0.005 0" rotation="-90 0 0">
      <a-ring radius-inner="2.6" radius-outer="2.63" color="#1e293b"></a-ring>
      <a-ring radius-inner="3.9" radius-outer="3.93" color="#1e293b"></a-ring>
    </a-entity>

    <!-- ================= DIORAMA 3D EKOSISTEM SUNGAI DINAMIS (KIRI) ================= -->
    <a-entity id="riverDiorama" position="-3.80 0.92 -2.15" rotation="0 52 0">
      <!-- Meja / Alas Diorama -->
      <a-box width="2.76" height="0.14" depth="1.66" position="0 -0.07 0" color="#1e293b"></a-box>
      <a-box width="2.80" height="0.03" depth="1.70" position="0 0.01 0" color="#38bdf8" material="shader: flat;"></a-box>
      <!-- Kaki Penyangga Meja Diorama -->
      <a-cylinder radius="0.06" height="0.78" position="-1.15 -0.53 -0.62" color="#334155"></a-cylinder>
      <a-cylinder radius="0.06" height="0.78" position="1.15 -0.53 -0.62" color="#334155"></a-cylinder>
      <a-cylinder radius="0.06" height="0.78" position="-1.15 -0.53 0.62" color="#334155"></a-cylinder>
      <a-cylinder radius="0.06" height="0.78" position="1.15 -0.53 0.62" color="#334155"></a-cylinder>

      <!-- Papan Status Ekosistem di Bagian Belakang Diorama -->
      <a-entity position="0 1.24 -0.76">
        <a-plane width="2.36" height="0.44" color="#334155" material="shader: flat;" position="0 0 -0.01"></a-plane>
        <a-plane width="2.32" height="0.40" color="#0f172a" material="shader: flat;" position="0 0 0"></a-plane>
        <a-text value="DIORAMA 3D EKOSISTEM SUNGAI" align="center" position="0 0.11 0.02" color="#38bdf8" width="2.1" wrap-count="36" font-weight="bold"></a-text>
        <a-plane id="dioramaStatusBg" width="2.14" height="0.16" color="#dc2626" material="shader: flat;" position="0 -0.07 0.01"></a-plane>
        <a-text id="dioramaStatusText" value="TERCEMAR LIMBAH | DO: 2.4 mg/L" align="center" position="0 -0.07 0.02" color="#ffffff" width="1.95" wrap-count="38"></a-text>
      </a-entity>

      <!-- Penampang Tanah Dasar Sungai -->
      <a-box width="2.62" height="0.24" depth="1.52" position="0 0.14 0" color="#451a03"></a-box>
      <!-- Dasar Kerikil Sungai -->
      <a-box width="1.12" height="0.05" depth="1.52" position="0 0.28 0" color="#57534e"></a-box>
      <a-dodecahedron radius="0.055" position="-0.32 0.31 -0.45" color="#78716c"></a-dodecahedron>
      <a-dodecahedron radius="0.045" position="0.28 0.30 -0.32" color="#a8a29e"></a-dodecahedron>
      <a-dodecahedron radius="0.06" position="-0.22 0.31 0.42" color="#78716c"></a-dodecahedron>
      <a-dodecahedron radius="0.05" position="0.34 0.30 0.52" color="#78716c"></a-dodecahedron>

      <!-- Bantaran Sungai Kiri -->
      <a-box width="0.76" height="0.32" depth="1.52" position="-0.93 0.41 0" color="#78350f"></a-box>
      <a-box width="0.78" height="0.05" depth="1.54" position="-0.92 0.58 0" color="#15803d"></a-box>

      <!-- Bantaran Sungai Kanan -->
      <a-box width="0.76" height="0.32" depth="1.52" position="0.93 0.41 0" color="#78350f"></a-box>
      <a-box width="0.78" height="0.05" depth="1.54" position="0.92 0.58 0" color="#15803d"></a-box>

      <!-- Vegetasi & Pepohonan Bantaran Sungai -->
      <a-entity position="-1.05 0.60 -0.48">
        <a-cylinder radius="0.03" height="0.22" position="0 0.11 0" color="#713f12"></a-cylinder>
        <a-cone radius-bottom="0.16" radius-top="0.01" height="0.28" position="0 0.30 0" color="#16a34a"></a-cone>
        <a-cone radius-bottom="0.12" radius-top="0.01" height="0.22" position="0 0.42 0" color="#22c55e"></a-cone>
      </a-entity>
      <a-entity position="1.06 0.60 -0.42">
        <a-cylinder radius="0.03" height="0.24" position="0 0.12 0" color="#713f12"></a-cylinder>
        <a-cone radius-bottom="0.17" radius-top="0.01" height="0.30" position="0 0.32 0" color="#15803d"></a-cone>
        <a-cone radius-bottom="0.12" radius-top="0.01" height="0.22" position="0 0.45 0" color="#22c55e"></a-cone>
      </a-entity>
      <a-entity position="-1.02 0.60 0.48">
        <a-cylinder radius="0.025" height="0.18" position="0 0.09 0" color="#713f12"></a-cylinder>
        <a-sphere radius="0.14" position="0 0.24 0" color="#16a34a"></a-sphere>
      </a-entity>
      <!-- Tanaman Air / Alang-alang Tepi -->
      <a-cone radius-bottom="0.025" radius-top="0.002" height="0.22" position="0.58 0.66 -0.18" rotation="0 0 8" color="#4ade80"></a-cone>
      <a-cone radius-bottom="0.025" radius-top="0.002" height="0.19" position="0.61 0.65 -0.12" rotation="0 0 -10" color="#22c55e"></a-cone>
      <a-cone radius-bottom="0.025" radius-top="0.002" height="0.21" position="-0.58 0.66 0.25" rotation="0 0 -8" color="#4ade80"></a-cone>

      <!-- Volume Air Sungai Dinamis -->
      <a-box id="riverWater" width="1.10" height="0.23" depth="1.50" position="0 0.415 0"
             material="color: #525829; opacity: 0.78; transparent: true;"></a-box>
      <a-plane id="riverSurface" width="1.10" height="1.50" rotation="-90 0 0" position="0 0.531 0"
               material="color: #656d33; opacity: 0.45; transparent: true;"></a-plane>

      <!-- Pipa Limbah & Busa Pencemar (Aktif saat tercemar) -->
      <a-entity id="pollutionGroup">
        <a-cylinder radius="0.045" height="0.28" position="-0.62 0.56 -0.46" rotation="0 0 90" color="#475569"></a-cylinder>
        <a-torus radius="0.048" radius-tubular="0.008" position="-0.48 0.56 -0.46" rotation="0 90 0" color="#334155"></a-torus>
        <!-- Aliran Limbah dari Pipa -->
        <a-cylinder id="sludgeStream" radius="0.028" height="0.16" position="-0.45 0.50 -0.46" rotation="0 0 25"
                    material="color: #3f3f1c; opacity: 0.88; transparent: true;"></a-cylinder>
        <!-- Lapisan Busa Limbah di Permukaan -->
        <a-entity id="foamClusters">
          <a-sphere radius="0.045" scale="1.6 0.35 1.3" position="-0.32 0.535 -0.42" color="#fef08a"></a-sphere>
          <a-sphere radius="0.038" scale="1.4 0.35 1.2" position="-0.22 0.535 -0.35" color="#ecfccb"></a-sphere>
          <a-sphere radius="0.05" scale="1.8 0.35 1.4" position="-0.10 0.535 -0.18" color="#fef08a"></a-sphere>
          <a-sphere radius="0.04" scale="1.5 0.35 1.3" position="0.14 0.535 0.05" color="#ecfccb"></a-sphere>
          <a-sphere radius="0.048" scale="1.7 0.35 1.2" position="-0.18 0.535 0.32" color="#fef08a"></a-sphere>
          <a-sphere radius="0.035" scale="1.4 0.35 1.2" position="0.22 0.535 0.44" color="#ecfccb"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Unit Bio-Filter Bertingkat (Muncul saat IP / PC / TI) -->
      <a-entity id="bioFilterGroup" position="0 0 -0.14" visible="false">
        <!-- Rangka Penahan Filter -->
        <a-box width="0.04" height="0.30" depth="0.20" position="-0.52 0.44 0" color="#cbd5e1"></a-box>
        <a-box width="0.04" height="0.30" depth="0.20" position="0.52 0.44 0" color="#cbd5e1"></a-box>
        <a-box width="1.08" height="0.02" depth="0.20" position="0 0.58 0" color="#38bdf8"></a-box>

        <!-- Lapis 1: Kerikil & Pasir Silika -->
        <a-box id="filterLayer1" width="1.00" height="0.065" depth="0.17" position="0 0.34 0"
               material="color: #94a3b8; opacity: 0.92; transparent: true;"></a-box>
        <!-- Lapis 2: Arang Aktif (Activated Carbon) -->
        <a-box id="filterLayer2" width="1.00" height="0.065" depth="0.17" position="0 0.415 0"
               material="color: #1e293b; opacity: 0.94; transparent: true;"></a-box>
        <!-- Lapis 3: Batu Zeolit & Bio-Media -->
        <a-box id="filterLayer3" width="1.00" height="0.065" depth="0.17" position="0 0.49 0"
               material="color: #7dd3fc; opacity: 0.90; transparent: true;"></a-box>
      </a-entity>

      <!-- Unit Aerator & Gelembung Oksigen -->
      <a-entity id="aeratorGroup" position="0 0 0.24" visible="false">
        <!-- Mesin Kompresor Aerator di Bantaran Kanan -->
        <a-box width="0.22" height="0.16" depth="0.18" position="0.82 0.68 0" color="#0284c7"></a-box>
        <a-box width="0.16" height="0.06" depth="0.19" position="0.82 0.71 0" color="#38bdf8"></a-box>
        <!-- Pipa Selang Udara ke Dasar Sungai -->
        <a-cylinder radius="0.012" height="0.36" position="0.62 0.55 0" rotation="0 0 48" color="#e0f2fe"></a-cylinder>
        <!-- Diffuser Aerator di Dasar Sungai -->
        <a-cylinder radius="0.018" height="0.72" position="0 0.315 0" rotation="0 0 90" color="#38bdf8"></a-cylinder>

        <!-- Aliran Gelembung Kiri (Aktif >= 20%) -->
        <a-entity id="bubbleStream1" position="-0.24 0 0">
          <a-sphere radius="0.016" position="0 0.33 0" color="#e0f2fe"
                    animation="property: position; from: 0 0.33 0; to: 0 0.52 0; dur: 1100; loop: true; easing: linear"></a-sphere>
          <a-sphere radius="0.012" position="0.03 0.33 0.02" color="#ffffff"
                    animation="property: position; from: 0.03 0.33 0.02; to: 0.03 0.52 0.02; dur: 1350; delay: 350; loop: true; easing: linear"></a-sphere>
        </a-entity>

        <!-- Aliran Gelembung Tengah (Aktif >= 50%) -->
        <a-entity id="bubbleStream2" position="0 0 0">
          <a-sphere radius="0.018" position="0 0.33 0" color="#e0f2fe"
                    animation="property: position; from: 0 0.33 0; to: 0 0.52 0; dur: 950; loop: true; easing: linear"></a-sphere>
          <a-sphere radius="0.013" position="-0.03 0.33 -0.02" color="#ffffff"
                    animation="property: position; from: -0.03 0.33 -0.02; to: -0.03 0.52 -0.02; dur: 1200; delay: 400; loop: true; easing: linear"></a-sphere>
        </a-entity>

        <!-- Aliran Gelembung Kanan (Aktif >= 80%) -->
        <a-entity id="bubbleStream3" position="0.24 0 0">
          <a-sphere radius="0.016" position="0 0.33 0" color="#e0f2fe"
                    animation="property: position; from: 0 0.33 0; to: 0 0.52 0; dur: 1050; loop: true; easing: linear"></a-sphere>
          <a-sphere radius="0.012" position="0.02 0.33 -0.02" color="#ffffff"
                    animation="property: position; from: 0.02 0.33 -0.02; to: 0.02 0.52 -0.02; dur: 1300; delay: 300; loop: true; easing: linear"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Populasi Ikan Sungai Dinamis -->
      <a-entity id="fishGroup">
        <!-- Ikan 1 (Selalu ada; pucat & lambat di permukaan saat tercemar, cerah saat pulih) -->
        <a-entity id="fish-1" position="-0.22 0.49 -0.30"
                  animation="property: position; from: -0.26 0.49 -0.32; to: -0.14 0.49 -0.26; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine">
          <a-sphere id="fishBody-1" radius="0.038" scale="1.6 0.85 0.65" color="#9ca3af"></a-sphere>
          <a-cone id="fishTail-1" radius-bottom="0.028" radius-top="0.002" height="0.045" position="-0.065 0 0" rotation="0 0 90" color="#9ca3af"></a-cone>
        </a-entity>

        <!-- Ikan 2 -->
        <a-entity id="fish-2" position="0.18 0.48 0.36"
                  animation="property: position; from: 0.22 0.48 0.34; to: 0.10 0.48 0.42; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine">
          <a-sphere id="fishBody-2" radius="0.036" scale="1.6 0.85 0.65" color="#9ca3af"></a-sphere>
          <a-cone id="fishTail-2" radius-bottom="0.026" radius-top="0.002" height="0.042" position="0.062 0 0" rotation="0 0 -90" color="#9ca3af"></a-cone>
        </a-entity>

        <!-- Ikan 3 (Muncul saat air membaik / pulih) -->
        <a-entity id="fish-3" position="-0.28 0.39 0.04" visible="false"
                  animation="property: position; from: -0.36 0.38 -0.02; to: 0.34 0.43 0.10; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
          <a-sphere radius="0.04" scale="1.7 0.9 0.65" color="#fb923c"></a-sphere>
          <a-cone radius-bottom="0.03" radius-top="0.002" height="0.048" position="-0.07 0 0" rotation="0 0 90" color="#f97316"></a-cone>
        </a-entity>

        <!-- Ikan 4 -->
        <a-entity id="fish-4" position="0.30 0.37 0.48" visible="false"
                  animation="property: position; from: 0.38 0.36 0.46; to: -0.34 0.41 0.56; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine">
          <a-sphere radius="0.038" scale="1.7 0.9 0.65" color="#38bdf8"></a-sphere>
          <a-cone radius-bottom="0.028" radius-top="0.002" height="0.045" position="0.068 0 0" rotation="0 0 -90" color="#0284c7"></a-cone>

      const statusBgEl = document.getElementById('dioramaStatusBg');
      const statusTxtEl = document.getElementById('dioramaStatusText');

      waterEl.setAttribute('material', `color: ${waterColor}; opacity: 0.78; transparent: true;`);
      surfaceEl.setAttribute('material', `color: ${surfaceColor}; opacity: 0.45; transparent: true;`);
      foamEl.setAttribute('visible', foamVisible);
      sludgeEl.setAttribute('visible', sludgeVisible);

      // Pengaturan lapisan Bio-Filter
      bioFilterEl.setAttribute('visible', filterLayers > 0);
      l1.setAttribute('visible', filterLayers >= 1);
      l2.setAttribute('visible', filterLayers >= 2);
      l3.setAttribute('visible', filterLayers >= 3);

      // Pengaturan Aerator & Gelembung Oksigen
      aeratorEl.setAttribute('visible', aeratorLevel > 0);
      b1.setAttribute('visible', aeratorLevel >= 1);
      b2.setAttribute('visible', aeratorLevel >= 2);
      b3.setAttribute('visible', aeratorLevel >= 3);

      // Pengaturan Populasi & Kesehatan Ikan
      const fBody1 = document.getElementById('fishBody-1');
      const fTail1 = document.getElementById('fishTail-1');
      const fBody2 = document.getElementById('fishBody-2');
      const fTail2 = document.getElementById('fishTail-2');

      if (healthyFish) {
        fBody1.setAttribute('color', '#fb923c');
        fTail1.setAttribute('color', '#ea580c');
        fBody2.setAttribute('color', '#38bdf8');
        fTail2.setAttribute('color', '#0284c7');
        document.getElementById('fish-3').setAttribute('visible', true);
        document.getElementById('fish-4').setAttribute('visible', true);
        document.getElementById('fish-5').setAttribute('visible', true);
        document.getElementById('fish-6').setAttribute('visible', true);
      } else {
        fBody1.setAttribute('color', '#9ca3af');
        fTail1.setAttribute('color', '#6b7280');
        fBody2.setAttribute('color', '#9ca3af');
        fTail2.setAttribute('color', '#6b7280');
        document.getElementById('fish-3').setAttribute('visible', false);
        document.getElementById('fish-4').setAttribute('visible', false);
        document.getElementById('fish-5').setAttribute('visible', false);
        document.getElementById('fish-6').setAttribute('visible', false);
      }

      statusBgEl.setAttribute('color', statusColor);
      statusTxtEl.setAttribute('value', statusText);
    }

    function updateRiverDiorama() {
      const isPcOrTiDone = completedStages.has("PC") || completedStages.has("TI");
      const isIpDone = completedStages.has("IP");

      // 1. Jika Tahap PC (atau TI) sudah tuntas -> kondisi ekosistem pulih optimal
      if (isPcOrTiDone && currentStage !== "PC") {
        setDioramaVisualState({
          waterColor: '#0284c7',
          surfaceColor: '#38bdf8',
          foamVisible: false,
          sludgeVisible: false,
          filterLayers: 3,
          aeratorLevel: 3,
          healthyFish: true,
          statusText: 'EKOSISTEM PULIH | DO: 7.2 mg/L',
          statusColor: '#16a34a'
        });
        return;
      }

      // 2. Saat siswa berada di Tahap PC -> pratinjau langsung sesuai opsi rotary (1-4)
      if (currentStage === "PC") {
        if (selectedOption === 1) {
          setDioramaVisualState({
            waterColor: '#3b6e5c',
            surfaceColor: '#4d8b74',
            foamVisible: true,
            sludgeVisible: false,
            filterLayers: 1,
            aeratorLevel: 1,
            healthyFish: false,
            statusText: 'PROTOTIPE 1: FILTER 1 LAPIS | DO: 4.8 mg/L',
            statusColor: '#d97706'
          });
        } else if (selectedOption === 2) {
          setDioramaVisualState({
            waterColor: '#157a8c',
            surfaceColor: '#22a6b3',
            foamVisible: false,
            sludgeVisible: false,
            filterLayers: 2,
            aeratorLevel: 2,
            healthyFish: false,
            statusText: 'PROTOTIPE 2: FILTER 2 LAPIS | DO: 5.8 mg/L',
            statusColor: '#0284c7'
          });
        } else if (selectedOption === 3) {
          setDioramaVisualState({
            waterColor: '#0284c7',
            surfaceColor: '#38bdf8',
            foamVisible: false,
            sludgeVisible: false,
            filterLayers: 3,
            aeratorLevel: 3,
            healthyFish: true,
            statusText: 'PROTOTIPE 3 (OPTIMAL) | DO: 7.2 mg/L',
            statusColor: '#16a34a'
          });
        } else {
          setDioramaVisualState({
            waterColor: '#4d6344',
            surfaceColor: '#658058',
            foamVisible: true,
            sludgeVisible: true,
            filterLayers: 0,
            aeratorLevel: 3,
            healthyFish: false,
            statusText: 'PROTOTIPE 4: TANPA FILTER (TURBULEN)',
            statusColor: '#dc2626'
          });
        }
        return;
      }

      // 3. Jika Tahap IP sudah dikonfirmasi -> instalasi awal unit bio-filter & aerator muncul
      if (isIpDone) {
        setDioramaVisualState({
          waterColor: '#1e6f78',
          surfaceColor: '#2a9d8f',
          foamVisible: false,
          sludgeVisible: false,
          filterLayers: 2,
          aeratorLevel: 1,
          healthyFish: false,
          statusText: 'UNIT FILTER TERPASANG | DO: 4.5 mg/L',
          statusColor: '#0284c7'
        });
        return;
      }

      // 4. Kondisi awal (Tahap EA / DI) -> sungai tercemar limbah
      setDioramaVisualState({
        waterColor: '#525829',
        surfaceColor: '#656d33',
        foamVisible: true,
        sludgeVisible: true,
        filterLayers: 0,
        aeratorLevel: 0,
        healthyFish: false,
        statusText: 'TERCEMAR LIMBAH | DO: 2.4 mg/L',
        statusColor: '#dc2626'
      });
    }

    function renderVRScene() {
      const sc = stemScenarios[currentStage];
      updateDesktopInterface();
      updateRiverDiorama();

      document.getElementById('vrSceneTag').setAttribute('value', sc.tag);
      document.getElementById('vrQuestionTitle').setAttribute('value', sc.title);
      document.getElementById('vrQuestionDesc').setAttribute('value', sc.desc);

      stageOrder.forEach(code => {
        const isActive = (code === currentStage);
        const isDone = completedStages.has(code);
        const borderEl = document.getElementById('stageBorder-' + code);
        const bgEl = document.getElementById('stageBg-' + code);
        const titleEl = document.getElementById('stageTitle-' + code);
        const subEl = document.getElementById('stageSub-' + code);
        const doneBgEl = document.getElementById('stageDoneBg-' + code);
        const doneTxtEl = document.getElementById('stageDoneTxt-' + code);

        if (isActive) {
          borderEl.setAttribute('color', '#38bdf8');
          bgEl.setAttribute('color', '#0369a1');
          titleEl.setAttribute('color', '#f8fafc');
          subEl.setAttribute('color', '#e0f2fe');
        } else {
          borderEl.setAttribute('color', '#334155');
          bgEl.setAttribute('color', '#1e293b');
          titleEl.setAttribute('color', '#cbd5e1');
          subEl.setAttribute('color', '#94a3b8');
        }

        doneBgEl.setAttribute('visible', isDone);
        doneTxtEl.setAttribute('visible', isDone);
      });

      const baseY = [0.14, -0.10, -0.34, -0.58];
      sc.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const isSelected = (optNum === selectedOption);

        const cardEl = document.getElementById('optCard-' + optNum);
        const borderEl = document.getElementById('optBorder-' + optNum);
        const bgEl = document.getElementById('optBg-' + optNum);
        const numBgEl = document.getElementById('optNumBg-' + optNum);
        const numTxtEl = document.getElementById('optNumTxt-' + optNum);

        document.getElementById('optText-' + optNum).setAttribute('value', optText);

        if (isSelected) {
          cardEl.setAttribute('position', `0.04 ${baseY[idx]} 0.03`);
          borderEl.setAttribute('color', '#facc15');
          bgEl.setAttribute('color', '#422006');
          numBgEl.setAttribute('color', '#facc15');
          numTxtEl.setAttribute('color', '#0f172a');
        } else {
          cardEl.setAttribute('position', `0 ${baseY[idx]} 0.02`);
          borderEl.setAttribute('color', '#334155');
          bgEl.setAttribute('color', '#1e293b');
          numBgEl.setAttribute('color', '#334155');
          numTxtEl.setAttribute('color', '#f8fafc');
        }
      });
    }

    function updateDesktopInterface() {
      document.querySelectorAll('.stage-button').forEach(button => {
        const code = button.dataset.stage;
        button.classList.toggle('active', code === currentStage);
        button.classList.toggle('done', completedStages.has(code));
      });
    }

    function setFeedbackBanner(type, message) {
      const borderEl = document.getElementById('vrFeedbackBorder');
      const bgEl = document.getElementById('vrFeedbackBg');
      const txtEl = document.getElementById('vrFeedbackText');

      txtEl.setAttribute('value', message);

      if (type === "success") {
        borderEl.setAttribute('color', '#10b981');
        bgEl.setAttribute('color', '#064e3b');
        txtEl.setAttribute('color', '#a7f3d0');
      } else if (type === "revise") {
        borderEl.setAttribute('color', '#ef4444');
        bgEl.setAttribute('color', '#7f1d1d');
        txtEl.setAttribute('color', '#fecaca');
      } else if (type === "info") {
        borderEl.setAttribute('color', '#3b82f6');
        bgEl.setAttribute('color', '#1e3a8a');
        txtEl.setAttribute('color', '#bfdbfe');
      } else {
        borderEl.setAttribute('color', '#334155');
        bgEl.setAttribute('color', '#0f172a');
        txtEl.setAttribute('color', '#facc15');
      }
    }

    function selectStage(stageCode) {
      if (!stemScenarios[stageCode]) return;
      currentStage = stageCode;
      selectedOption = 1;
      isLockedForRevise = false;
      setFeedbackBanner("default", `Aktif di ${stemScenarios[stageCode].tag}. Pilih opsi jawaban, lalu tekan Konfirmasi.`);
      addLog(`TAHAP -> ${stageCode}`);
      renderVRScene();
    }

    function selectOptionManual(optNum) {
      selectedOption = optNum;
      if (isLockedForRevise) {
        setFeedbackBanner("info", "Jawaban sebelumnya perlu direvisi. Tekan tombol Revisi sebelum mengonfirmasi pilihan baru.");
      }
      addLog(`PILIH -> Tahap ${currentStage}, Opsi ${selectedOption}`);
      renderVRScene();
    }

    function stepOption(direction) {
      if (direction > 0) {
        selectedOption = (selectedOption % 4) + 1;
      } else {
        selectedOption = selectedOption === 1 ? 4 : selectedOption - 1;
      }
      if (isLockedForRevise) {
        setFeedbackBanner("info", "Mode evaluasi: Tekan tombol Revisi terlebih dahulu sebelum Konfirmasi ulang.");
      }
      addLog(`NAVIGASI -> Opsi ${selectedOption}`);
      renderVRScene();
    }

    function handleConfirmAction() {
      totalAttempts++;
      document.getElementById('vrTotalAttempt').setAttribute('value', String(totalAttempts));

      const sc = stemScenarios[currentStage];
      const isCorrect = (selectedOption === sc.correctIndex);

      if (isCorrect) {
        setFeedbackBanner("success", sc.successMsg);
        completedStages.add(currentStage);
        isLockedForRevise = false;
      } else {
        setFeedbackBanner("revise", sc.failMsg);
        isLockedForRevise = true;
      }

      recordInteraction(currentStage, selectedOption, "KONFIRMASI", isCorrect ? "BENAR" : "SALAH");
      updateGrowthMindsetProfile();
      renderVRScene();
    }

    function handleReviseAction() {
      totalRevises++;
      isLockedForRevise = false;
      document.getElementById('vrTotalRevise').setAttribute('value', String(totalRevises));

      setFeedbackBanner("info", "Mode revisi aktif: Silakan pilih opsi jawaban yang lebih tepat, lalu tekan Konfirmasi.");
      recordInteraction(currentStage, selectedOption, "REVISI", "PERBAIKAN");
      updateGrowthMindsetProfile();
      renderVRScene();
    }

    // ================= PEMERIKSAAN KONEKSI BLUETOOTH BERKALA =================
    function applyConnectionVisual(state) {
      const pill = document.getElementById('desktopStatus');
      const deskText = document.getElementById('desktopStatusText');
      const vrStatusEl = document.getElementById('vrConnectionStatus');
      const vrStatusBg = document.getElementById('vrStatusBg');

      if (state === "connected") {
        if (pill) {
          pill.classList.add('connected');
          pill.classList.remove('disconnected');
        }
        if (deskText) deskText.textContent = 'BT Terhubung';
        vrStatusEl.setAttribute('value', 'MVR Terhubung');
        vrStatusBg.setAttribute('color', '#16a34a');
      } else if (state === "disconnected") {
        if (pill) {
          pill.classList.remove('connected');
          pill.classList.add('disconnected');
        }
        if (deskText) deskText.textContent = 'BT Terputus';
        vrStatusEl.setAttribute('value', 'Koneksi Terputus');
        vrStatusBg.setAttribute('color', '#dc2626');
      } else {
        if (pill) {
          pill.classList.remove('connected', 'disconnected');
        }
        if (deskText) deskText.textContent = 'Menunggu BT...';
        vrStatusEl.setAttribute('value', 'Menunggu Koneksi');
        vrStatusBg.setAttribute('color', '#334155');
      }
    }

    function registerBluetoothHeartbeat() {
      lastBtHeartbeat = Date.now();
      if (btConnectionState !== "connected") {
        btConnectionState = "connected";
        applyConnectionVisual("connected");
        addLog("BT -> Kontroler MVR terhubung.");
      }
    }

    function checkBluetoothConnection() {
      const now = Date.now();
      const isHeartbeatAlive = (lastBtHeartbeat > 0) && ((now - lastBtHeartbeat) <= BT_TIMEOUT_MS);

      if (isHeartbeatAlive) {
        if (btConnectionState !== "connected") {
          btConnectionState = "connected";
          applyConnectionVisual("connected");
          addLog("BT -> Kontroler MVR terhubung.");
        }
      } else if (lastBtHeartbeat > 0) {
        if (btConnectionState !== "disconnected") {
          btConnectionState = "disconnected";
          applyConnectionVisual("disconnected");
          addLog("BT -> Sinyal kontroler terputus.");
        }
      } else {
        applyConnectionVisual("waiting");
      }
    }

    function updateGrowthMindsetProfile() {
      const gmEl = document.getElementById('vrGmProfile');
      if (totalRevises > 0 && completedStages.size >= 2) {
        gmEl.setAttribute('value', "Growth Mindset");
        gmEl.setAttribute('color', "#34d399");
      } else if (totalRevises > 0) {
        gmEl.setAttribute('value', "Proses Revisi");
        gmEl.setAttribute('color', "#38bdf8");
      } else if (completedStages.size === 5) {
        gmEl.setAttribute('value', "Sangat Baik");
        gmEl.setAttribute('color', "#a78bfa");
      }
    }

    function recordInteraction(stage, option, action, status) {
      const entry = {
        waktu_lokal: new Date().toLocaleTimeString(),
        timestamp_ms: Date.now(),
        kode_tahap: stage,
        pilihan_opsi: option,
        aksi: action,
        status_evaluasi: status,
        kumulatif_attempt: totalAttempts,
        kumulatif_revise: totalRevises
      };
      interactionHistory.push(entry);
      addLog(`${action} | ${stage} | Opsi ${option} (${status})`);
    }

    function addLog(msg) {
      const timestamp = new Date().toLocaleTimeString();
      logLines.unshift(`[${timestamp}] ${msg}`);
      if (logLines.length > 10) logLines.pop();
      document.getElementById('vrLogBox').setAttribute('value', logLines.join("\n"));
    }

    function exportCSV() {
      if (interactionHistory.length === 0) {
        setFeedbackBanner("info", "Belum ada data interaksi yang terekam untuk disimpan.");
        return;
      }
      const headers = Object.keys(interactionHistory[0]).join(",");
      const rows = interactionHistory.map(obj => Object.values(obj).join(","));
      const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");

      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", "profil_pembelajaran_stem_dt_vr.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      addLog("Catatan interaksi berhasil disimpan.");
    }

    // ================= PENERIMA SINYAL DARI ESP32 BLE HID & KEYBOARD =================
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();

      if (key === 't') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        return;
      }

      if (key >= '1' && key <= '5') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        selectStage(stageOrder[parseInt(key, 10) - 1]);
      } else if (key === 'r' || key === '*') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        handleReviseAction();
      } else if (key === 'k' || key === 'enter' || key === '#') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        handleConfirmAction();
      } else if (key === 'n' || e.key === 'ArrowDown') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        stepOption(1);
      } else if (key === 'p' || e.key === 'ArrowUp') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        stepOption(-1);
      } else if (key === 's') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        addLog(`SINKRON -> Tahap ${currentStage}, Opsi ${selectedOption}`);
      }
    });

    renderVRScene();
    checkBluetoothConnection();
    setInterval(checkBluetoothConnection, 2500);

    const vrScene = document.querySelector('a-scene');
    vrScene.addEventListener('enter-vr', () => {
      document.getElementById('desktopUi').style.display = 'none';
    });
    vrScene.addEventListener('exit-vr', () => {
      document.getElementById('desktopUi').style.display = '';
    });
  </script>
</body>
