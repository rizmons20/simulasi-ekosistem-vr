<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi MVR - Simulasi Ekosistem (STEM-DT VR)</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    :root {
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.16);
      --panel: rgba(15, 23, 42, 0.84);
      --cyan: #38bdf8;
      --green: #34d399;
      --amber: #facc15;
      --red: #f87171;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020617;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .a-enter-vr {
      right: 18px !important;
      bottom: 124px !important;
    }

    .a-enter-vr-button {
      width: 46px !important;
      height: 46px !important;
      border-radius: 14px !important;
      background: rgba(15, 23, 42, 0.92) !important;
      border: 1px solid rgba(56, 189, 248, 0.45) !important;
      box-shadow: 0 12px 32px rgba(2, 6, 23, 0.38);
    }

    .desktop-ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      color: var(--ink);
    }

    .topbar,
    .stage-dock,
    .control-dock {
      pointer-events: auto;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 16px 48px rgba(2, 6, 23, 0.28);
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 8px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #082f49;
      background: linear-gradient(135deg, #7dd3fc, #22d3ee);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.22);
    }

    .brand-copy strong {
      display: block;
      font-size: 13.5px;
      letter-spacing: 0.01em;
    }

    .brand-copy span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-pill {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border-radius: 12px;
      color: #e0f2fe;
      background: rgba(14, 165, 233, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.4);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 160ms ease;
    }

    .audio-pill:hover {
      filter: brightness(1.12);
    }

    .audio-pill.muted {
      color: #94a3b8;
      background: rgba(51, 65, 85, 0.55);
      border-color: var(--line);
    }

    .status-pill {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border-radius: 12px;
      color: #cbd5e1;
      background: rgba(51, 65, 85, 0.55);
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.7);
      transition: background 200ms ease, box-shadow 200ms ease;
    }

    .status-pill.connected .status-dot {
      background: var(--green);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.75);
    }

    .status-pill.disconnected .status-dot {
      background: var(--red);
      box-shadow: 0 0 14px rgba(248, 113, 113, 0.75);
    }

    .dock-button {
      border: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: 160ms ease;
    }

    .dock-button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .stage-dock {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      height: 68px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px;
    }

    .stage-button {
      min-width: 118px;
      height: 52px;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 7px 11px;
      color: #94a3b8;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: 160ms ease;
    }

    .stage-button:hover {
      background: rgba(51, 65, 85, 0.45);
      color: #e2e8f0;
    }

    .stage-button.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.28), rgba(56, 189, 248, 0.12));
      border-color: rgba(56, 189, 248, 0.5);
      color: #f8fafc;
    }

    .stage-button.done {
      border-color: rgba(52, 211, 153, 0.28);
    }

    .stage-button strong {
      display: block;
      font-size: 12px;
    }

    .stage-button span {
      display: block;
      margin-top: 3px;
      font-size: 9.5px;
      white-space: nowrap;
    }

    .control-dock {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 164px;
      border-radius: 18px;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .dock-button {
      height: 40px;
      border-radius: 11px;
      background: rgba(51, 65, 85, 0.72);
      font-size: 11.5px;
    }

    .dock-button.confirm {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #0284c7, #0891b2);
      border-color: rgba(125, 211, 252, 0.35);
      font-weight: 700;
    }

    .dock-button.revise {
      color: #fecaca;
    }

    .dock-button.export {
      color: #cbd5e1;
    }

    @media (max-width: 980px) {
      .brand-copy span { display: none; }
      .stage-dock {
        left: 18px;
        right: 18px;
        transform: none;
        overflow-x: auto;
      }
      .stage-button { min-width: 104px; }
      .control-dock { display: none; }
      .a-enter-vr { bottom: 96px !important; }
    }

    @media (max-width: 640px) {
      .topbar { height: 52px; top: 10px; left: 10px; right: 10px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-copy strong { font-size: 11.5px; }
      .status-pill { height: 34px; max-width: 140px; overflow: hidden; font-size: 10.5px; }
      .audio-pill { height: 34px; padding: 0 9px; font-size: 10.5px; }
      .stage-dock { bottom: 10px; left: 10px; right: 10px; height: 62px; }
      .stage-button { min-width: 82px; height: 46px; }
      .stage-button span { display: none; }
    }
  </style>
</head>
<body>
  <div class="desktop-ui" id="desktopUi">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-copy">
          <strong>Simulasi Ekosistem Sungai</strong>
          <span>STEM-DT · Mixed & Virtual Reality</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="audio-pill" id="desktopAudioBtn" type="button" onclick="toggleAudioMute()">
          <span id="desktopAudioText">Audio: Aktif</span>
        </button>
        <div class="status-pill" id="desktopStatus">
          <span class="status-dot"></span>
          <span id="desktopStatusText">Memeriksa koneksi...</span>
        </div>
      </div>
    </header>

    <nav class="stage-dock" aria-label="Tahap pembelajaran">
      <button class="stage-button active" type="button" data-stage="EA" onclick="selectStage('EA')">
        <strong>1 · EA</strong><span>Empathize & Ask</span>
      </button>
      <button class="stage-button" type="button" data-stage="DI" onclick="selectStage('DI')">
        <strong>2 · DI</strong><span>Define & Imagine</span>
      </button>
      <button class="stage-button" type="button" data-stage="IP" onclick="selectStage('IP')">
        <strong>3 · IP</strong><span>Ideate & Plan</span>
      </button>
      <button class="stage-button" type="button" data-stage="PC" onclick="selectStage('PC')">
        <strong>4 · PC</strong><span>Prototype & Create</span>
      </button>
      <button class="stage-button" type="button" data-stage="TI" onclick="selectStage('TI')">
        <strong>5 · TI</strong><span>Test & Improve</span>
      </button>
    </nav>

    <aside class="control-dock" aria-label="Kontrol simulasi">
      <button class="dock-button revise" type="button" onclick="handleReviseAction()">Revisi</button>
      <button class="dock-button export" type="button" onclick="exportCSV()" title="Simpan catatan interaksi">Ekspor</button>
      <button class="dock-button confirm" type="button" onclick="handleConfirmAction()">Konfirmasi</button>
    </aside>
  </div>

  <a-scene fog="type: exponential; color: #7c8b99; density: 0.015">
    <!-- Pencahayaan Alam Terbuka -->
    <a-light type="ambient" color="#e2e8f0" intensity="0.85"></a-light>
    <a-light type="directional" position="-6 12 8" color="#fffbeb" intensity="0.90"></a-light>
    <a-light type="hemisphere" color="#bae6fd" groundColor="#3f6212" intensity="0.45"></a-light>

    <!-- Langit & Horizon Dinamis -->
    <a-sky id="skyEnvironment" color="#7c8b99"></a-sky>

    <!-- ================= LINGKUNGAN EKOSISTEM SUNGAI 360° SKALA PENUH ================= -->
    <a-entity id="riverEnvironment">
      <!-- 1. DERMAGA KAYU PENGAMATAN (POSISI PENGGUNA BERDIRI) -->
      <a-entity id="observationDeck" position="0 0 0">
        <a-box width="7.2" height="0.08" depth="4.2" position="0.3 0.01 0.2" color="#78350f"></a-box>
        <a-box width="7.24" height="0.03" depth="0.14" position="0.3 0.04 -1.86" color="#92400e"></a-box>
        <a-cylinder radius="0.09" height="1.2" position="-3.1 -0.45 -1.8" color="#451a03"></a-cylinder>
        <a-cylinder radius="0.09" height="1.2" position="0.3 -0.45 -1.8" color="#451a03"></a-cylinder>
        <a-cylinder radius="0.09" height="1.2" position="3.7 -0.45 -1.8" color="#451a03"></a-cylinder>

        <!-- Pagar Pembatas Sisi Kiri Jauh & Kanan Jauh (Tengah terbuka ke sungai) -->
        <a-cylinder radius="0.04" height="0.82" position="-3.1 0.43 -1.82" color="#92400e"></a-cylinder>
        <a-cylinder radius="0.04" height="0.82" position="-1.8 0.43 -1.82" color="#92400e"></a-cylinder>
        <a-box width="1.42" height="0.05" depth="0.06" position="-2.45 0.82 -1.82" color="#b45309"></a-box>

        <a-cylinder radius="0.04" height="0.82" position="2.2 0.43 -1.82" color="#92400e"></a-cylinder>
        <a-cylinder radius="0.04" height="0.82" position="3.7 0.43 -1.82" color="#92400e"></a-cylinder>
        <a-box width="1.62" height="0.05" depth="0.06" position="2.95 0.82 -1.82" color="#b45309"></a-box>

        <!-- Papan Sensor Kualitas Air di Tepi Kanan Depan Dermaga (Terlihat Jelas & Utuh) -->
        <a-entity position="1.38 0.56 -1.80" rotation="0 -18 0" scale="0.72 0.72 0.72">
          <a-cylinder radius="0.03" height="0.62" position="0 -0.34 0" color="#475569"></a-cylinder>
          <a-plane width="2.10" height="0.46" color="#334155" material="shader: flat;" position="0 0 -0.01"></a-plane>
          <a-plane width="2.06" height="0.42" color="#0f172a" material="shader: flat;" position="0 0 0"></a-plane>
          <a-text value="SENSOR EKOSISTEM SUNGAI" align="center" position="0 0.12 0.02" color="#38bdf8" width="1.85" wrap-count="34" font-weight="bold"></a-text>
          <a-plane id="dioramaStatusBg" width="1.90" height="0.17" color="#dc2626" material="shader: flat;" position="0 -0.07 0.01"></a-plane>
          <a-text id="dioramaStatusText" value="TERCEMAR LIMBAH | DO: 2.4 mg/L" align="center" position="0 -0.07 0.02" color="#ffffff" width="1.75" wrap-count="36"></a-text>
        </a-entity>
      </a-entity>

      <!-- 2. BANTARAN DARATAN SEKITAR & PERBUKITAN -->
      <a-box width="35" height="1.1" depth="24" position="-20.8 -0.52 2" color="#3f6212"></a-box>
      <a-box width="35" height="1.1" depth="24" position="21.4 -0.52 2" color="#3f6212"></a-box>
      <a-box width="80" height="1.1" depth="18" position="0 -0.52 11.2" color="#365314"></a-box>

      <a-box width="90" height="1.4" depth="32" position="0 -0.55 -27.5" color="#3f6212"></a-box>
      <a-box width="90" height="0.35" depth="2.2" position="0 -0.15 -11.8" color="#57534e"></a-box>

      <a-cone radius-bottom="14" radius-top="1.5" height="9" position="-18 3.8 -32" color="#166534"></a-cone>
      <a-cone radius-bottom="18" radius-top="2" height="11" position="-2 4.8 -36" color="#15803d"></a-cone>
      <a-cone radius-bottom="15" radius-top="1.5" height="9.5" position="16 4.0 -33" color="#166534"></a-cone>
      <a-cone radius-bottom="14" radius-top="2" height="8.5" position="-32 3.5 -12" color="#14532d"></a-cone>
      <a-cone radius-bottom="14" radius-top="2" height="8.5" position="32 3.5 -10" color="#14532d"></a-cone>

      <a-entity position="-5.2 0 -3.2">
        <a-cylinder radius="0.16" height="1.8" position="0 0.9 0" color="#713f12"></a-cylinder>
        <a-cone radius-bottom="1.2" radius-top="0.05" height="2.4" position="0 2.5 0" color="#15803d"></a-cone>
        <a-cone radius-bottom="0.95" radius-top="0.05" height="2.0" position="0 3.6 0" color="#16a34a"></a-cone>
      </a-entity>
      <a-entity position="-6.8 0 -8.5">
        <a-cylinder radius="0.18" height="2.0" position="0 1.0 0" color="#713f12"></a-cylinder>
        <a-sphere radius="1.3" position="0 2.6 0" color="#15803d"></a-sphere>
      </a-entity>

      <a-entity position="5.6 0 -2.8">
        <a-cylinder radius="0.16" height="1.8" position="0 0.9 0" color="#713f12"></a-cylinder>
        <a-cone radius-bottom="1.2" radius-top="0.05" height="2.4" position="0 2.5 0" color="#15803d"></a-cone>
        <a-cone radius-bottom="0.9" radius-top="0.05" height="1.9" position="0 3.5 0" color="#22c55e"></a-cone>
      </a-entity>
      <a-entity position="7.4 0 -8.0">
        <a-cylinder radius="0.18" height="2.1" position="0 1.05 0" color="#713f12"></a-cylinder>
        <a-sphere radius="1.35" position="0 2.7 0" color="#16a34a"></a-sphere>
      </a-entity>

      <a-entity position="-8.5 0.1 -13.8">
        <a-cylinder radius="0.18" height="2.0" position="0 1.0 0" color="#713f12"></a-cylinder>
        <a-cone radius-bottom="1.3" radius-top="0.05" height="2.6" position="0 2.7 0" color="#166534"></a-cone>
      </a-entity>
      <a-entity position="-1.5 0.1 -14.5">
        <a-cylinder radius="0.20" height="2.2" position="0 1.1 0" color="#713f12"></a-cylinder>
        <a-cone radius-bottom="1.4" radius-top="0.05" height="2.8" position="0 2.9 0" color="#15803d"></a-cone>
      </a-entity>
      <a-entity position="6.8 0.1 -13.6">
        <a-cylinder radius="0.18" height="2.0" position="0 1.0 0" color="#713f12"></a-cylinder>
        <a-sphere radius="1.4" position="0 2.7 0" color="#166534"></a-sphere>
      </a-entity>

      <a-dodecahedron radius="0.45" position="-3.6 -0.15 -2.4" color="#78716c"></a-dodecahedron>
      <a-dodecahedron radius="0.35" position="-3.2 -0.20 -2.1" color="#57534e"></a-dodecahedron>
      <a-dodecahedron radius="0.48" position="4.2 -0.15 -2.5" color="#78716c"></a-dodecahedron>
      <a-cone radius-bottom="0.06" radius-top="0.005" height="0.85" position="-3.4 0.15 -2.8" rotation="0 0 8" color="#4ade80"></a-cone>
      <a-cone radius-bottom="0.06" radius-top="0.005" height="0.75" position="-3.25 0.12 -2.9" rotation="0 0 -10" color="#22c55e"></a-cone>
      <a-cone radius-bottom="0.06" radius-top="0.005" height="0.85" position="4.0 0.15 -2.9" rotation="0 0 -8" color="#4ade80"></a-cone>

      <!-- 3. DASAR SUNGAI & VOLUME AIR DINAMIS -->
      <a-box width="90" height="0.2" depth="16" position="0 -1.05 -6.2" color="#78716c"></a-box>
      <a-dodecahedron radius="0.28" position="-2.2 -0.88 -3.5" color="#57534e"></a-dodecahedron>
      <a-dodecahedron radius="0.22" position="-0.8 -0.90 -4.2" color="#a8a29e"></a-dodecahedron>
      <a-dodecahedron radius="0.30" position="1.4 -0.88 -3.6" color="#57534e"></a-dodecahedron>
      <a-dodecahedron radius="0.25" position="2.8 -0.90 -4.8" color="#a8a29e"></a-dodecahedron>
      <a-dodecahedron radius="0.32" position="-1.5 -0.88 -6.8" color="#57534e"></a-dodecahedron>
      <a-dodecahedron radius="0.26" position="0.9 -0.89 -7.2" color="#a8a29e"></a-dodecahedron>

      <a-cone radius-bottom="0.08" radius-top="0.01" height="0.55" position="-1.8 -0.70 -3.4" color="#15803d"></a-cone>
      <a-cone radius-bottom="0.07" radius-top="0.01" height="0.48" position="-1.65 -0.72 -3.3" rotation="0 0 -12" color="#22c55e"></a-cone>
      <a-cone radius-bottom="0.08" radius-top="0.01" height="0.58" position="1.9 -0.70 -3.8" color="#15803d"></a-cone>

      <a-box id="riverWater" width="90" height="0.82" depth="15.5" position="0 -0.54 -6.2"
             material="color: #464d24; opacity: 0.88; transparent: true;"></a-box>
      <a-plane id="riverSurface" width="90" height="15.5" rotation="-90 0 0" position="0 -0.125 -6.2"
               material="color: #59632e; opacity: 0.48; transparent: true;"></a-plane>

      <!-- Garis Riak Arus Sungai Bergerak -->
      <a-entity id="waterRipples">
        <a-plane width="2.2" height="0.06" rotation="-90 0 0" position="-3 -0.115 -2.8"
                 material="color: #cbd5e1; opacity: 0.22; transparent: true;"
                 animation="property: position; from: -6 -0.115 -2.8; to: 6 -0.115 -2.8; dur: 5200; loop: true; easing: linear"></a-plane>
        <a-plane width="2.8" height="0.06" rotation="-90 0 0" position="1 -0.115 -4.1"
                 material="color: #cbd5e1; opacity: 0.20; transparent: true;"
                 animation="property: position; from: -7 -0.115 -4.1; to: 7 -0.115 -4.1; dur: 6100; loop: true; easing: linear"></a-plane>
        <a-plane width="2.5" height="0.06" rotation="-90 0 0" position="-1 -0.115 -5.6"
                 material="color: #cbd5e1; opacity: 0.18; transparent: true;"
                 animation="property: position; from: -8 -0.115 -5.6; to: 8 -0.115 -5.6; dur: 6800; loop: true; easing: linear"></a-plane>
      </a-entity>

      <!-- 4. PIPA LIMBAH & BUSA PENCEMAR (BANTARAN KIRI DEPAN) -->
      <a-entity id="pollutionGroup" position="-2.85 -0.02 -3.65">
        <a-cylinder radius="0.22" height="1.8" position="-0.75 0.16 0" rotation="0 0 90" color="#475569"></a-cylinder>
        <a-torus radius="0.23" radius-tubular="0.035" position="0.15 0.16 0" rotation="0 90 0" color="#334155"></a-torus>
        <a-cylinder id="sludgeStream" radius="0.14" height="0.62" position="0.30 -0.05 0" rotation="0 0 32"
                    material="color: #3a3b18; opacity: 0.94; transparent: true;"></a-cylinder>
        <!-- Gumpalan Busa Limbah Terfokus di Dekat Aliran Pipa -->
        <a-entity id="foamClusters">
          <a-sphere radius="0.16" scale="1.6 0.20 1.2" position="0.48 -0.10 0.08" color="#d9d7a3"></a-sphere>
          <a-sphere radius="0.13" scale="1.4 0.20 1.1" position="0.82 -0.10 0.28" color="#c7c58e"></a-sphere>
          <a-sphere radius="0.18" scale="1.8 0.20 1.3" position="1.25 -0.10 0.15" color="#d9d7a3"></a-sphere>
          <a-sphere radius="0.14" scale="1.5 0.20 1.2" position="1.78 -0.10 0.42" color="#c7c58e"></a-sphere>
          <a-sphere radius="0.15" scale="1.6 0.20 1.1" position="2.30 -0.10 0.12" color="#d9d7a3"></a-sphere>
          <a-sphere radius="0.13" scale="1.4 0.20 1.1" position="1.05 -0.10 0.65" color="#c7c58e"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- 5. INSTALASI BIO-FILTER BERTINGKAT SKALA PENUH -->
      <a-entity id="bioFilterGroup" position="-1.25 -0.95 -4.9" rotation="0 16 0" visible="false">
        <a-box width="0.14" height="1.05" depth="0.55" position="-1.75 0.52 0" color="#cbd5e1"></a-box>
        <a-box width="0.14" height="1.05" depth="0.55" position="1.75 0.52 0" color="#cbd5e1"></a-box>
        <a-box width="3.70" height="0.06" depth="0.62" position="0 1.04 0" color="#0284c7"></a-box>

        desc: "Evaluasi efektivitas prototipe bio-filter & aerator berdasarkan kondisi sungai yang telah pulih.",

    let currentStage = "EA";
    let selectedOption = 1;
    let isLockedForRevise = false;
    let totalAttempts = 0;
    let totalRevises = 0;
    let completedStages = new Set();
    let interactionHistory = [];
    let logLines = [];

    // Status koneksi Bluetooth periodik
    let lastBtHeartbeat = 0;
    let btConnectionState = "waiting"; // "waiting" | "connected" | "disconnected"
    const BT_TIMEOUT_MS = 6000;

    // ================= MESIN AUDIO PROSEDURAL (WEB AUDIO API) =================
    const SoundEngine = (() => {
      let ctx = null;
      let isMuted = false;
      let riverGain = null;
      let riverFilter = null;
      let aeratorLevel = 0;
      let isTurbulent = false;
      let bubbleTimer = null;

      function ensureContext() {
        if (isMuted) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
          setupRiverAmbient();
          startBubbleLoop();
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function setupRiverAmbient() {
        if (!ctx) return;
        const bufferSize = ctx.sampleRate * 3;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.025 * white)) / 1.025;
          lastOut = output[i];
          output[i] *= 2.8;
        }

        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        riverFilter = ctx.createBiquadFilter();
        riverFilter.type = 'lowpass';
        riverFilter.frequency.value = 340;
        riverFilter.Q.value = 0.7;

        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = 0.22;
        lfoGain.gain.value = 75;
        lfo.connect(lfoGain);
        lfoGain.connect(riverFilter.frequency);
        lfo.start();

        riverGain = ctx.createGain();
        riverGain.gain.value = isMuted ? 0 : 0.075;

        whiteNoise.connect(riverFilter);
        riverFilter.connect(riverGain);
        riverGain.connect(ctx.destination);
        whiteNoise.start();
        applyRiverMix();
      }

      function applyRiverMix() {
        if (!ctx || !riverGain || !riverFilter) return;
        const now = ctx.currentTime;
        if (isMuted) {
          riverGain.gain.setTargetAtTime(0, now, 0.1);
          return;
        }
        const targetGain = isTurbulent ? 0.12 : 0.075;
        const targetFreq = isTurbulent ? 520 : 340;
        riverGain.gain.setTargetAtTime(targetGain, now, 0.25);
        riverFilter.frequency.setTargetAtTime(targetFreq, now, 0.25);
      }

      function triggerSingleBubble() {
        if (isMuted || !ctx || ctx.state !== 'running' || aeratorLevel <= 0) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        const startFreq = 260 + Math.random() * 220;
        const endFreq = startFreq + 280 + Math.random() * 260;
        const duration = 0.045 + Math.random() * 0.035;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);

        const vol = (0.018 + aeratorLevel * 0.008);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(vol, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.01);
      }

      function startBubbleLoop() {
        if (bubbleTimer) return;
        bubbleTimer = setInterval(() => {
          if (isMuted || aeratorLevel <= 0) return;
          const burstCount = aeratorLevel;
          for (let i = 0; i < burstCount; i++) {
            setTimeout(triggerSingleBubble, i * 75 + Math.random() * 50);
          }
        }, 320);
      }

      function setEnvironmentAudio(level, turbulent) {
        aeratorLevel = level;
        isTurbulent = turbulent;
        applyRiverMix();
      }

      function playNote(freq, startOffset, duration, type = 'sine', volume = 0.09) {
        const audioCtx = ensureContext();
        if (!audioCtx || isMuted) return;
        const t = audioCtx.currentTime + startOffset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t);
        osc.stop(t + duration + 0.01);
      }

      function playCue(kind) {
        if (isMuted) return;
        ensureContext();
        if (kind === 'tick') {
          playNote(580, 0, 0.035, 'triangle', 0.07);
        } else if (kind === 'stage') {
          playNote(440, 0, 0.07, 'sine', 0.08);
          playNote(587.33, 0.065, 0.10, 'sine', 0.08);
        } else if (kind === 'sync') {
          playNote(659.25, 0, 0.08, 'sine', 0.07);
        } else if (kind === 'revise') {
          playNote(440, 0, 0.08, 'triangle', 0.08);
          playNote(329.63, 0.075, 0.12, 'triangle', 0.08);
        } else if (kind === 'success') {
          playNote(523.25, 0, 0.09, 'sine', 0.09);
          playNote(659.25, 0.08, 0.09, 'sine', 0.09);
          playNote(783.99, 0.16, 0.18, 'sine', 0.10);
        } else if (kind === 'error') {
          playNote(210, 0, 0.11, 'sawtooth', 0.065);
          playNote(165, 0.11, 0.16, 'sawtooth', 0.065);
        }
      }

      function toggleMute() {
        isMuted = !isMuted;
        if (!isMuted) {
          ensureContext();
        }
        applyRiverMix();
        return !isMuted;
      }

      return {
        unlock: ensureContext,
        setEnvironmentAudio,
        playCue,
        toggleMute
      };
    })();

    function toggleAudioMute() {
      const active = SoundEngine.toggleMute();
      const deskBtn = document.getElementById('desktopAudioBtn');
      const deskTxt = document.getElementById('desktopAudioText');
      const vrBg = document.getElementById('vrAudioBg');
      const vrTxt = document.getElementById('vrAudioStatus');

      if (deskBtn) deskBtn.classList.toggle('muted', !active);
      if (deskTxt) deskTxt.textContent = active ? 'Audio: Aktif' : 'Audio: Mati';
      if (vrBg) vrBg.setAttribute('color', active ? '#0284c7' : '#334155');
      if (vrTxt) vrTxt.setAttribute('value', active ? 'Suara: ON' : 'Suara: OFF');

      if (active) {
        SoundEngine.playCue('sync');
        addLog('AUDIO -> Efek suara diaktifkan.');
      } else {
        addLog('AUDIO -> Efek suara dimatikan.');
      }
    }

    // ================= PEMBARUAN LINGKUNGAN EKOSISTEM SUNGAI 360° =================
    function setRiverEnvironmentState({
      skyColor,
      waterColor,
      waterOpacity,
      surfaceColor,
      foamVisible,
      sludgeVisible,
      filterLayers,
      aeratorLevel,

      const skyEl = document.getElementById('skyEnvironment');
      const waterEl = document.getElementById('riverWater');

      const foamEl = document.getElementById('foamClusters');
      const sludgeEl = document.getElementById('sludgeStream');

      const l1 = document.getElementById('filterLayer1');
      const l2 = document.getElementById('filterLayer2');
      const l3 = document.getElementById('filterLayer3');
      const aeratorEl = document.getElementById('aeratorGroup');
      const b1 = document.getElementById('bubbleStream1');
      const b2 = document.getElementById('bubbleStream2');
      const b3 = document.getElementById('bubbleStream3');

      skyEl.setAttribute('color', skyColor);
      sceneEl.setAttribute('fog', `type: exponential; color: ${skyColor}; density: 0.015`);

      foamEl.setAttribute('visible', foamVisible);
      sludgeEl.setAttribute('visible', sludgeVisible);

      SoundEngine.setEnvironmentAudio(aeratorLevel, isTurbulent);

      bioFilterEl.setAttribute('visible', filterLayers > 0);
      l1.setAttribute('visible', filterLayers >= 1);
      l2.setAttribute('visible', filterLayers >= 2);
      l3.setAttribute('visible', filterLayers >= 3);

      aeratorEl.setAttribute('visible', aeratorLevel > 0);
      b1.setAttribute('visible', aeratorLevel >= 1);
      b2.setAttribute('visible', aeratorLevel >= 2);
      b3.setAttribute('visible', aeratorLevel >= 3);

      const fBody1 = document.getElementById('fishBody-1');
      const fTail1 = document.getElementById('fishTail-1');
      const fBody2 = document.getElementById('fishBody-2');
      const fTail2 = document.getElementById('fishTail-2');

      if (healthyFish) {
        fBody1.setAttribute('color', '#fb923c');
        fTail1.setAttribute('color', '#ea580c');
        fBody2.setAttribute('color', '#38bdf8');
        fTail2.setAttribute('color', '#0284c7');
        for (let i = 3; i <= 8; i++) {
          document.getElementById('fish-' + i).setAttribute('visible', true);

      } else {
        fBody1.setAttribute('color', '#9ca3af');
        fTail1.setAttribute('color', '#6b7280');
        fBody2.setAttribute('color', '#9ca3af');
        fTail2.setAttribute('color', '#6b7280');
        for (let i = 3; i <= 8; i++) {
          document.getElementById('fish-' + i).setAttribute('visible', false);
        }
      }

      statusBgEl.setAttribute('color', statusColor);
      statusTxtEl.setAttribute('value', statusText);
    }

    function updateRiverEnvironment() {
      const isPcOrTiDone = completedStages.has("PC") || completedStages.has("TI");

      if (isPcOrTiDone && currentStage !== "PC") {
        setRiverEnvironmentState({
          skyColor: '#38bdf8',

          waterOpacity: 0.64,
          surfaceColor: '#7dd3fc',

          sludgeVisible: false,
          filterLayers: 3,

      if (currentStage === "PC") {

            waterOpacity: 0.64,
            surfaceColor: '#7dd3fc',
            foamVisible: false,
            sludgeVisible: false,
            filterLayers: 3,
            aeratorLevel: 3,
            isTurbulent: false,

            skyColor: '#64748b',

            waterOpacity: 0.85,
            surfaceColor: '#658058',

          sludgeVisible: false,
          filterLayers: 2,
          aeratorLevel: 1,
          isTurbulent: false,
          healthyFish: false,
          statusText: 'UNIT FILTER TERPASANG | DO: 4.5 mg/L',
          statusColor: '#0284c7'
        });
        return;
      }

      setRiverEnvironmentState({
        skyColor: '#7c8b99',
        waterColor: '#464d24',
        waterOpacity: 0.88,
        surfaceColor: '#59632e',
        foamVisible: true,
        sludgeVisible: true,
        filterLayers: 0,
        aeratorLevel: 0,
        isTurbulent: false,
        healthyFish: false,
        statusText: 'TERCEMAR LIMBAH | DO: 2.4 mg/L',
        statusColor: '#dc2626'
      });
    }

      setFeedbackBanner("default", `Aktif di ${stemScenarios[stageCode].tag}. Pilih opsi jawaban, lalu tekan Konfirmasi.`);
      addLog(`TAHAP -> ${stageCode}`);
      renderVRScene();

    function selectOptionManual(optNum) {
      selectedOption = optNum;
      SoundEngine.playCue('tick');
      if (isLockedForRevise) {
        setFeedbackBanner("info", "Jawaban sebelumnya perlu direvisi. Tekan tombol Revisi sebelum mengonfirmasi pilihan baru.");
      }
      addLog(`PILIH -> Tahap ${currentStage}, Opsi ${selectedOption}`);
      renderVRScene();
    }

    function stepOption(direction) {
      if (direction > 0) {
        selectedOption = (selectedOption % 4) + 1;
      } else {
        selectedOption = selectedOption === 1 ? 4 : selectedOption - 1;
      }
      SoundEngine.playCue('tick');
      if (isLockedForRevise) {
        setFeedbackBanner("info", "Mode evaluasi: Tekan tombol Revisi terlebih dahulu sebelum Konfirmasi ulang.");
      }
      addLog(`NAVIGASI -> Opsi ${selectedOption}`);
      renderVRScene();
    }

    function handleConfirmAction() {
      totalAttempts++;
      document.getElementById('vrTotalAttempt').setAttribute('value', String(totalAttempts));

      const sc = stemScenarios[currentStage];
      const isCorrect = (selectedOption === sc.correctIndex);

      if (isCorrect) {
        SoundEngine.playCue('success');
        setFeedbackBanner("success", sc.successMsg);
        completedStages.add(currentStage);
        isLockedForRevise = false;
      } else {
        SoundEngine.playCue('error');
        setFeedbackBanner("revise", sc.failMsg);
        isLockedForRevise = true;
      }

      recordInteraction(currentStage, selectedOption, "KONFIRMASI", isCorrect ? "BENAR" : "SALAH");
      updateGrowthMindsetProfile();
      renderVRScene();
    }

    function handleReviseAction() {
      totalRevises++;
      isLockedForRevise = false;
      document.getElementById('vrTotalRevise').setAttribute('value', String(totalRevises));

      SoundEngine.playCue('revise');
      setFeedbackBanner("info", "Mode revisi aktif: Silakan pilih opsi jawaban yang lebih tepat, lalu tekan Konfirmasi.");
      recordInteraction(currentStage, selectedOption, "REVISI", "PERBAIKAN");
      updateGrowthMindsetProfile();
      renderVRScene();
    }

    // ================= PEMERIKSAAN KONEKSI BLUETOOTH BERKALA =================
    function applyConnectionVisual(state) {
      const pill = document.getElementById('desktopStatus');
      const deskText = document.getElementById('desktopStatusText');
      const vrStatusEl = document.getElementById('vrConnectionStatus');
      const vrStatusBg = document.getElementById('vrStatusBg');

      if (state === "connected") {
        if (pill) {
          pill.classList.add('connected');
          pill.classList.remove('disconnected');
        }
        if (deskText) deskText.textContent = 'BT Terhubung';
        vrStatusEl.setAttribute('value', 'MVR Terhubung');
        vrStatusBg.setAttribute('color', '#16a34a');
      } else if (state === "disconnected") {
        if (pill) {
          pill.classList.remove('connected');
          pill.classList.add('disconnected');
        }
        if (deskText) deskText.textContent = 'BT Terputus';
        vrStatusEl.setAttribute('value', 'Koneksi Terputus');
        vrStatusBg.setAttribute('color', '#dc2626');
      } else {
        if (pill) {
          pill.classList.remove('connected', 'disconnected');
        }
        if (deskText) deskText.textContent = 'Menunggu BT...';
        vrStatusEl.setAttribute('value', 'Menunggu Koneksi');
        vrStatusBg.setAttribute('color', '#334155');
      }
    }

    function registerBluetoothHeartbeat() {
      lastBtHeartbeat = Date.now();
      if (btConnectionState !== "connected") {
        btConnectionState = "connected";
        applyConnectionVisual("connected");
        addLog("BT -> Kontroler MVR terhubung.");
      }
    }

    function checkBluetoothConnection() {
      const now = Date.now();
      const isHeartbeatAlive = (lastBtHeartbeat > 0) && ((now - lastBtHeartbeat) <= BT_TIMEOUT_MS);

      if (isHeartbeatAlive) {
        if (btConnectionState !== "connected") {
          btConnectionState = "connected";
          applyConnectionVisual("connected");
          addLog("BT -> Kontroler MVR terhubung.");
        }
      } else if (lastBtHeartbeat > 0) {
        if (btConnectionState !== "disconnected") {
          btConnectionState = "disconnected";
          applyConnectionVisual("disconnected");
          addLog("BT -> Sinyal kontroler terputus.");
        }
      } else {
        applyConnectionVisual("waiting");
      }
    }

    function updateGrowthMindsetProfile() {
      const gmEl = document.getElementById('vrGmProfile');
      if (totalRevises > 0 && completedStages.size >= 2) {
        gmEl.setAttribute('value', "Growth Mindset");
        gmEl.setAttribute('color', "#34d399");
      } else if (totalRevises > 0) {
        gmEl.setAttribute('value', "Proses Revisi");
        gmEl.setAttribute('color', "#38bdf8");
      } else if (completedStages.size === 5) {
        gmEl.setAttribute('value', "Sangat Baik");
        gmEl.setAttribute('color', "#a78bfa");
      }
    }

    function recordInteraction(stage, option, action, status) {
      const entry = {
        waktu_lokal: new Date().toLocaleTimeString(),
        timestamp_ms: Date.now(),
        kode_tahap: stage,
        pilihan_opsi: option,
        aksi: action,
        status_evaluasi: status,
        kumulatif_attempt: totalAttempts,
        kumulatif_revise: totalRevises
      };
      interactionHistory.push(entry);
      addLog(`${action} | ${stage} | Opsi ${option} (${status})`);
    }

    function addLog(msg) {
      const timestamp = new Date().toLocaleTimeString();
      logLines.unshift(`[${timestamp}] ${msg}`);
      if (logLines.length > 10) logLines.pop();
      document.getElementById('vrLogBox').setAttribute('value', logLines.join("\n"));
    }

    function exportCSV() {
      SoundEngine.playCue('sync');
      if (interactionHistory.length === 0) {
        setFeedbackBanner("info", "Belum ada data interaksi yang terekam untuk disimpan.");
        return;
      }
      const headers = Object.keys(interactionHistory[0]).join(",");
      const rows = interactionHistory.map(obj => Object.values(obj).join(","));
      const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");

      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", "profil_pembelajaran_stem_dt_vr.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      addLog("Catatan interaksi berhasil disimpan.");
    }

    window.addEventListener('pointerdown', () => SoundEngine.unlock(), { once: true });

    // ================= PENERIMA SINYAL DARI ESP32 BLE HID & KEYBOARD =================
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();

      if (key === 't') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        return;
      }

      SoundEngine.unlock();

      if (key >= '1' && key <= '5') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        selectStage(stageOrder[parseInt(key, 10) - 1]);
      } else if (key === 'r' || key === '*') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        handleReviseAction();
      } else if (key === 'k' || key === 'enter' || key === '#') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        handleConfirmAction();
      } else if (key === 'n' || e.key === 'ArrowDown') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        stepOption(1);
      } else if (key === 'p' || e.key === 'ArrowUp') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        stepOption(-1);
      } else if (key === 's') {
        e.preventDefault();
        registerBluetoothHeartbeat();
        SoundEngine.playCue('sync');
        addLog(`SINKRON -> Tahap ${currentStage}, Opsi ${selectedOption}`);
      }
    });

    renderVRScene();
    checkBluetoothConnection();
    setInterval(checkBluetoothConnection, 2500);

    const vrScene = document.querySelector('a-scene');
    vrScene.addEventListener('enter-vr', () => {
      SoundEngine.unlock();
      document.getElementById('desktopUi').style.display = 'none';
    });
    vrScene.addEventListener('exit-vr', () => {
      document.getElementById('desktopUi').style.display = '';
    });
  </script>
</body>
</html>
